name: Setup
description: Install Node.js from .nvmrc and the project's dependencies. Does not check out the repository.

inputs:
  cache:
    description: Restore and save the npm cache. Off for release builds.
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: ${{ inputs.cache == 'true' && 'npm' || '' }}

    - name: Install dependencies
      shell: bash
      run: npm ci
