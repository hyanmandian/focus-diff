# Weekly, and a week behind: a version published in the last 7 days waits, so a freshly hijacked release has time to
# be caught and pulled before it gets here. Titles follow Conventional Commits, which the pull request check enforces.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
