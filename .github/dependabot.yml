version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: cargo
    directory: /packages/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Sao_Paulo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      rust:
        patterns: ['*']
    commit-message:
      prefix: chore(deps)
