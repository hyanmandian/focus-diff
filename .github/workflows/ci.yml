name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run lint
      - run: npm run build
      - name: Validate the Firefox build with Mozilla's add-on linter
        run: npx --yes web-ext@8 lint --source-dir dist/firefox --self-hosted
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip
