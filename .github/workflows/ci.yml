name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: Extension — check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/extension

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck, lint, format, duplication, dependencies, lockfile and unused code
        run: npm run check

      - name: Unit tests, with coverage
        run: npm run test:coverage

      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Lint the Firefox build as Firefox Add-ons does
        run: npm run lint:firefox

      - name: Build the store zips
        run: npm run zip && npm run zip:firefox && npm run zip:safari

      - name: Upload the zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: packages/extension/.output/*.zip

      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: packages/extension/test-results/

  desktop:
    name: Desktop — check, test and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Format, lint and typecheck
        run: npx vp check

      - name: Unit tests, at full coverage
        run: npx vp test --coverage

      - name: Install the browsers for the end-to-end tests
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-playwright-traces
          path: packages/desktop/test-results/

  desktop-rust:
    name: Desktop — Rust lint and tests
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/desktop/src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app's pages are built into the binary, so the front end has to be there first.
      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the pages
        working-directory: packages/desktop
        run: npx vp build

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked
