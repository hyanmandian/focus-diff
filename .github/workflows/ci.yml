name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: 22
          cache: true
      - run: vp install
      - run: vp check
      - run: vp run lint
      - run: vp test
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip
