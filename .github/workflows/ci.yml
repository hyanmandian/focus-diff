name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: Extension — check, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/extension

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck, lint, format, duplication, dependencies, lockfile and unused code
        run: npm run check

      - name: Unit tests, with coverage
        run: npm run test:coverage

      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Lint the Firefox build as Firefox Add-ons does
        run: npm run lint:firefox

      - name: Build the store zips
        run: npm run zip && npm run zip:firefox && npm run zip:safari

      - name: Upload the zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: packages/extension/.output/*.zip
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: packages/extension/test-results/

  desktop:
    name: Desktop — check, test and end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Format, lint and typecheck
        run: npx vp check

      - name: Unit tests, at full coverage
        run: npx vp test --coverage

      - name: Install the browsers for the end-to-end tests
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload the Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-playwright-traces
          path: packages/desktop/test-results/

  desktop-rust:
    name: Desktop — Rust lint and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop/src-tauri
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install what Tauri needs on Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

  desktop-scenarios:
    name: Desktop — the app in every situation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install what Tauri needs on Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Install a virtual screen and a session bus on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends xvfb dbus-x11

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the app with its test controls
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            npm run tauri build -- --bundles app --features devctl --config '{"bundle":{"createUpdaterArtifacts":false}}'
            echo "APP=src-tauri/target/release/bundle/macos/Focus Diff.app" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = Windows ]; then
            npm run tauri build -- --no-bundle --features devctl
            echo "APP=src-tauri/target/release/focus-diff.exe" >> "$GITHUB_ENV"
          else
            npm run tauri build -- --no-bundle --features devctl
            echo "APP=src-tauri/target/release/focus-diff" >> "$GITHUB_ENV"
          fi

      - name: With the GitHub CLI signed out
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a node tests/app/scenarios.ts "$APP" signed-out
          else
            node tests/app/scenarios.ts "$APP" signed-out
          fi

      - name: With the GitHub CLI signed in
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a node tests/app/scenarios.ts "$APP" token
          else
            node tests/app/scenarios.ts "$APP" token
          fi

      - name: Take the GitHub CLI away (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command gh -All -ErrorAction SilentlyContinue | ForEach-Object { Rename-Item $_.Source "$($_.Source).off" }
          $default = 'C:\Program Files\GitHub CLI\gh.exe'
          if (Test-Path $default) { Rename-Item $default 'gh.exe.off' }

      - name: Take the GitHub CLI away (Mac and Linux)
        if: runner.os != 'Windows'
        run: |
          for found in $(which -a gh) /usr/bin/gh /usr/local/bin/gh /opt/homebrew/bin/gh; do
            if [ -e "$found" ]; then sudo mv "$found" "$found.off"; fi
          done

      - name: Without the GitHub CLI
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- xvfb-run -a node tests/app/scenarios.ts "$APP" missing
          else
            node tests/app/scenarios.ts "$APP" missing
          fi

  desktop-bundle:
    name: Desktop — installers and a first launch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install what Tauri needs on Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the installers
        run: npm run tauri build -- --no-sign

      - name: Install the .deb and check the app stays up (Linux)
        if: runner.os == 'Linux'
        working-directory: packages/desktop/src-tauri/target/release/bundle/deb
        run: |
          cp ./*.deb focus-diff.deb
          docker run --rm -v "$PWD:/deb:ro" ubuntu:24.04@sha256:24737cef17f4e22b1977df7d9a05e77c4e28b7da5b8911f8d8ccda136bf3573c bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq /deb/focus-diff.deb xvfb dbus-x11 > /dev/null
            Xvfb :99 -screen 0 1440x900x24 > /dev/null 2>&1 &
            export DISPLAY=:99
            eval "$(dbus-launch --sh-syntax)"
            focus-diff > /tmp/launch.log 2>&1 &
            pid=$!
            sleep 20
            alive=0
            if kill -0 "$pid" 2> /dev/null; then alive=1; fi
            cat /tmp/launch.log
            if [ "$alive" -ne 1 ]; then echo "The app quit at start"; exit 1; fi
          '

      - name: Start the app and check it stays up (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: packages/desktop/src-tauri/target/release
        run: |
          $app = Start-Process -FilePath .\focus-diff.exe -PassThru -RedirectStandardError launch.log
          Start-Sleep -Seconds 20
          if ($app.HasExited) { Get-Content launch.log; throw "The app quit at start (exit code $($app.ExitCode))" }
          Stop-Process -Id $app.Id
          Get-Content launch.log

      - name: Install with the site's script and check the app stays up (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'packages/site/src/install.ps1')
          Start-Sleep -Seconds 20
          $running = Get-Process | Where-Object { $_.Path -like "$env:LOCALAPPDATA\Focus Diff\*" }
          if (-not $running) { throw 'The installed app is not running' }
          $running | Stop-Process

      - name: Upload the installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: |
            packages/desktop/src-tauri/target/release/bundle/nsis/*.exe
            packages/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            packages/desktop/src-tauri/target/release/bundle/deb/*.deb
            packages/desktop/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  site:
    name: Site — check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/site
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint, format, duplication and unused code
        run: npm run check

      - name: Lint the Mac install script
        run: sh -n src/install.sh && shellcheck src/install.sh

      - name: Build the site
        run: npm run build
