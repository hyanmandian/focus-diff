name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs['packages/extension--release_created'] }}
      tag: ${{ steps.release.outputs['packages/extension--tag_name'] }}
      desktop-created: ${{ steps.release.outputs['packages/desktop--release_created'] }}
      desktop-tag: ${{ steps.release.outputs['packages/desktop--tag_name'] }}
      desktop-version: ${{ steps.release.outputs['packages/desktop--version'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Check, test and zip the release
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/extension
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Typecheck, lint, format, duplication, dependencies, lockfile and unused code
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Lint the Firefox build as Firefox Add-ons does
        run: npm run lint:firefox

      - name: Zip the builds
        run: |
          npm run zip && npm run zip:firefox && npm run zip:safari
          mkdir release
          cp .output/*-chrome.zip release/focus-diff-chromium.zip
          cp .output/*-firefox.zip release/focus-diff-firefox.zip
          cp .output/*-safari.zip release/focus-diff-safari.zip
          cp .output/*-sources.zip release/focus-diff-sources.zip

      - name: Upload the zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: packages/extension/release/*.zip
          if-no-files-found: error

  release-assets:
    name: Sign, attach and publish the release
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - name: Download the zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Attest the build provenance of the zips
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - name: Attach the zips and their provenance, then publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          head -n 1 "$BUNDLE" | jq . > release/focus-diff.sigstore.json
          jq -c .dsseEnvelope "$BUNDLE" > release/focus-diff.intoto.jsonl
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  desktop-build:
    name: Check, test and build the Mac app
    needs: release-please
    if: ${{ needs.release-please.outputs.desktop-created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.desktop-tag }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Format, lint and typecheck
        run: npx vp check

      - name: Unit tests, at full coverage
        run: npx vp test --coverage

      - name: Rust tests
        working-directory: packages/desktop/src-tauri
        run: cargo test --locked

      - name: Add both Mac architectures to Rust
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build the app
        run: >-
          npm run tauri build -- --target universal-apple-darwin --bundles app,dmg
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Check the app's ad-hoc signature
        run: codesign --verify --deep --strict src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app

      - name: Archive the app for the updater
        working-directory: packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos
        env:
          COPYFILE_DISABLE: '1'
        run: tar -czf "Focus Diff.app.tar.gz" "Focus Diff.app"

      - name: Gather the files
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir release
          cp "$bundle"/dmg/*.dmg release/Focus-Diff.dmg
          cp "$bundle"/macos/*.app.tar.gz release/Focus-Diff.app.tar.gz

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-macos
          path: packages/desktop/release/*
          if-no-files-found: error

  desktop-build-other:
    name: Build the app for ${{ matrix.os }}
    needs: release-please
    if: ${{ needs.release-please.outputs.desktop-created == 'true' }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.desktop-tag }}
          persist-credentials: false

      - name: Install what Tauri needs on Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Setup
        uses: ./.github/actions/setup
        with:
          cache: 'false'

      - name: Rust tests
        working-directory: packages/desktop/src-tauri
        run: cargo test --locked

      - name: Build the app
        run: npm run tauri build -- --no-sign

      - name: Gather the files
        env:
          OS: ${{ runner.os }}
        run: |
          bundle=src-tauri/target/release/bundle
          mkdir release
          if [ "$OS" = Windows ]; then
            cp "$bundle"/nsis/*-setup.exe release/Focus-Diff-Setup.exe
          else
            cp "$bundle"/appimage/*.AppImage release/Focus-Diff.AppImage
            cp "$bundle"/deb/*.deb release/Focus-Diff.deb
            cp "$bundle"/rpm/*.rpm release/Focus-Diff.rpm
          fi

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-${{ runner.os }}
          path: packages/desktop/release/*
          if-no-files-found: error

  desktop-sign:
    name: Sign the desktop app's updates
    needs: [release-please, desktop-build, desktop-build-other]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions: {}
    steps:
      - name: Download the app, for every system
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: release

      - name: Sign the updater's files, with the Tauri CLI alone in an empty folder
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          npm_config_ignore_scripts: 'true'
        run: |
          release="$PWD/release"
          cd "$(mktemp -d)"
          for file in Focus-Diff.app.tar.gz Focus-Diff-Setup.exe Focus-Diff.AppImage; do
            npx --yes @tauri-apps/cli@2.12.4 signer sign "$release/$file" > /dev/null
            test -s "$release/$file.sig"
          done

      - name: Write latest.json
        env:
          TAG: ${{ needs.release-please.outputs.desktop-tag }}
          VERSION: ${{ needs.release-please.outputs.desktop-version }}
        run: |
          mkdir signatures
          mv release/*.sig signatures/
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --rawfile mac signatures/Focus-Diff.app.tar.gz.sig \
            --rawfile windows signatures/Focus-Diff-Setup.exe.sig \
            --rawfile linux signatures/Focus-Diff.AppImage.sig \
            '{version: $version, pub_date: $date, platforms: {
              "linux-x86_64": {url: "\($base)/Focus-Diff.AppImage", signature: $linux},
              "darwin-aarch64": {url: "\($base)/Focus-Diff.app.tar.gz", signature: $mac},
              "darwin-x86_64": {url: "\($base)/Focus-Diff.app.tar.gz", signature: $mac},
              "windows-x86_64": {url: "\($base)/Focus-Diff-Setup.exe", signature: $windows}}}' \
            > signatures/latest.json

      - name: Upload the signatures and latest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-signatures
          path: signatures/*
          if-no-files-found: error

  desktop-assets:
    name: Attest, attach and publish the desktop app
    needs: [release-please, desktop-sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.desktop-tag }}
    steps:
      - name: Download the app, for every system
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: release

      - name: Write SHA256SUMS
        working-directory: release
        run: |
          sha256sum Focus-Diff.dmg Focus-Diff.app.tar.gz Focus-Diff-Setup.exe Focus-Diff.AppImage Focus-Diff.deb Focus-Diff.rpm \
            > SHA256SUMS

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/Focus-Diff.dmg
            release/Focus-Diff.app.tar.gz
            release/Focus-Diff-Setup.exe
            release/Focus-Diff.AppImage
            release/Focus-Diff.deb
            release/Focus-Diff.rpm

      - name: Attach the files, publish the release and point the updater at it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest=false --repo "$GITHUB_REPOSITORY"
          if ! gh release view desktop-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create desktop-latest --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Focus Diff desktop: newest" \
              --notes "The newest desktop app, at links that don't change: Focus-Diff.dmg (Mac), Focus-Diff-Setup.exe (Windows), Focus-Diff.AppImage, .deb or .rpm (Linux). The installed app looks for updates here too."
          fi
          gh release upload desktop-latest release/latest.json release/Focus-Diff.dmg release/Focus-Diff-Setup.exe \
            release/Focus-Diff.AppImage release/Focus-Diff.deb release/Focus-Diff.rpm release/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
