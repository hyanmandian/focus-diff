# Every merge to main updates a release pull request for each app that changed (packages/extension, tagged v1.x; and
# packages/desktop, tagged desktop-v0.x), with the next version and its changelog, worked out from the conventional
# pull request titles. Merging it tags the release and creates it as a draft; then, for the extension:
#
#   1. `build` checks, tests and zips the tagged commit, with read-only access.
#   2. `release-assets` signs the zips' build provenance, attaches them and the provenance to the draft, and
#      publishes the release as the latest, so the site's "latest release" download links only ever see a complete one.
#
# And for the desktop app:
#
#   1. `desktop-build` checks and tests it, then builds the Mac app (one universal build for Apple Silicon and Intel):
#      a .dmg to install from and the updater's archive, signed with the updater key.
#   2. `desktop-assets` attests and attaches them, publishes the release (never as the latest: that's the extension's,
#      which the site links to), and puts latest.json, what the installed apps check for updates, on the fixed
#      `desktop-latest` release.
#
# The Mac app is signed ad hoc, not with an Apple Developer ID: the first time, macOS asks to confirm opening it
# (right-click → Open, or System Settings → Privacy & Security → Open Anyway). Updates after that install by themselves.
#
# The stores get the release's zips by hand: focus-diff-chromium.zip on the Chrome Web Store, and
# focus-diff-firefox.zip with focus-diff-sources.zip on Firefox Add-ons.
#
# One-time setup, in the repository's settings (not done by CI):
#   - Releases can be made immutable (Settings → General → Releases): assets go on while the release is a draft.
#   - Secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD: the updater key whose public half is
#     in packages/desktop/src-tauri/tauri.conf.json.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs['packages/extension--release_created'] }}
      tag: ${{ steps.release.outputs['packages/extension--tag_name'] }}
      desktop-created: ${{ steps.release.outputs['packages/desktop--release_created'] }}
      desktop-tag: ${{ steps.release.outputs['packages/desktop--tag_name'] }}
      desktop-version: ${{ steps.release.outputs['packages/desktop--version'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Check, test and zip the release
    needs: release-please
    if: ${{ needs.release-please.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/extension
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Typecheck, lint, format, duplication, dependencies, lockfile and unused code
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Install the browser for the end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Lint the Firefox build as Firefox Add-ons does
        run: npm run lint:firefox

      # Fixed names, so the site can link to the latest release's files: one build for every Chromium browser
      # (Chrome, Edge, Brave, Arc, Opera), one for Firefox and the browsers built on it, one for Safari, and the
      # sources Firefox Add-ons reviews.
      - name: Zip the builds
        run: |
          npm run zip && npm run zip:firefox && npm run zip:safari
          mkdir release
          cp .output/*-chrome.zip release/focus-diff-chromium.zip
          cp .output/*-firefox.zip release/focus-diff-firefox.zip
          cp .output/*-safari.zip release/focus-diff-safari.zip
          cp .output/*-sources.zip release/focus-diff-sources.zip

      - name: Upload the zips
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: packages/extension/release/*.zip
          if-no-files-found: error

  release-assets:
    name: Sign, attach and publish the release
    needs: [release-please, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - name: Download the zips
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Attest the build provenance of the zips
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      # `gh attestation verify <zip> --repo hyanmandian/focus-diff` checks a zip against the Sigstore bundle; the
      # .intoto.jsonl file holds the same signed SLSA provenance as a DSSE envelope, the form OpenSSF Scorecard
      # (Signed-Releases) looks for.
      - name: Attach the zips and their provenance, then publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          head -n 1 "$BUNDLE" | jq . > release/focus-diff.sigstore.json
          jq -c .dsseEnvelope "$BUNDLE" > release/focus-diff.intoto.jsonl
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  desktop-build:
    name: Check, test and build the Mac app
    needs: release-please
    if: ${{ needs.release-please.outputs.desktop-created == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/desktop
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.desktop-tag }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Format, lint and typecheck
        run: npx vp check

      - name: Unit tests, at full coverage
        run: npx vp test --coverage

      - name: Rust tests
        working-directory: packages/desktop/src-tauri
        run: cargo test --locked

      - name: Add both Mac architectures to Rust
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # One app for Apple Silicon and Intel, signed ad hoc; the updater's archive signed with the updater key.
      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target universal-apple-darwin --bundles app,dmg

      # Fixed names without spaces, and the updater's entries for the Mac (latest.json is put together
      # from every system's in desktop-assets).
      - name: Gather the files
        env:
          TAG: ${{ needs.release-please.outputs.desktop-tag }}
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir release
          cp "$bundle"/dmg/*.dmg release/Focus-Diff.dmg
          cp "$bundle"/macos/*.app.tar.gz release/Focus-Diff.app.tar.gz
          cp "$bundle"/macos/*.app.tar.gz.sig release/Focus-Diff.app.tar.gz.sig
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Focus-Diff.app.tar.gz"
          jq -n --arg url "$url" --rawfile signature release/Focus-Diff.app.tar.gz.sig \
            '{"darwin-aarch64": {url: $url, signature: $signature}, "darwin-x86_64": {url: $url, signature: $signature}}' \
            > release/platforms-macos.json

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-macos
          path: packages/desktop/release/*
          if-no-files-found: error

  desktop-build-other:
    name: Build the app for ${{ matrix.os }}
    needs: release-please
    if: ${{ needs.release-please.outputs.desktop-created == 'true' }}
    strategy:
      fail-fast: true
      matrix:
        # Linux on the oldest supported Ubuntu: an AppImage runs on systems as new as or newer than its glibc.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.desktop-tag }}
          persist-credentials: false

      - name: Install what Tauri needs on Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Setup
        uses: ./.github/actions/setup

      - name: Rust tests
        working-directory: packages/desktop/src-tauri
        run: cargo test --locked

      # Not code-signed (Windows shows SmartScreen's warning on the first run); the updater's files
      # signed with the updater key, as the Mac's.
      - name: Build the app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Gather the files
        env:
          TAG: ${{ needs.release-please.outputs.desktop-tag }}
          OS: ${{ runner.os }}
        run: |
          bundle=src-tauri/target/release/bundle
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          mkdir release
          if [ "$OS" = Windows ]; then
            cp "$bundle"/nsis/*-setup.exe release/Focus-Diff-Setup.exe
            cp "$bundle"/nsis/*-setup.exe.sig release/Focus-Diff-Setup.exe.sig
            jq -n --arg url "$base/Focus-Diff-Setup.exe" --rawfile signature release/Focus-Diff-Setup.exe.sig \
              '{"windows-x86_64": {url: $url, signature: $signature}}' > release/platforms-windows.json
          else
            cp "$bundle"/appimage/*.AppImage release/Focus-Diff.AppImage
            cp "$bundle"/appimage/*.AppImage.sig release/Focus-Diff.AppImage.sig
            cp "$bundle"/deb/*.deb release/Focus-Diff.deb
            cp "$bundle"/rpm/*.rpm release/Focus-Diff.rpm
            jq -n --arg url "$base/Focus-Diff.AppImage" --rawfile signature release/Focus-Diff.AppImage.sig \
              '{"linux-x86_64": {url: $url, signature: $signature}}' > release/platforms-linux.json
          fi

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-${{ runner.os }}
          path: packages/desktop/release/*
          if-no-files-found: error

  desktop-assets:
    name: Attest, attach and publish the desktop app
    needs: [release-please, desktop-build, desktop-build-other]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.desktop-tag }}
    steps:
      - name: Download the app, for every system
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-release-*
          merge-multiple: true
          path: release

      # latest.json: the version, and where each system gets it with its signature.
      - name: Write latest.json
        env:
          VERSION: ${{ needs.release-please.outputs.desktop-version }}
        run: |
          jq -s --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, pub_date: $date, platforms: add}' release/platforms-*.json > release/latest.json
          rm release/platforms-*.json

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/Focus-Diff.dmg
            release/Focus-Diff.app.tar.gz
            release/Focus-Diff-Setup.exe
            release/Focus-Diff.AppImage
            release/Focus-Diff.deb
            release/Focus-Diff.rpm

      # Published, but not as the latest release: that stays the extension's, which the site links to. Then
      # latest.json goes on desktop-latest, the one place installed apps look for updates.
      - name: Attach the files, publish the release and point the updater at it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest=false --repo "$GITHUB_REPOSITORY"
          if ! gh release view desktop-latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create desktop-latest --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Focus Diff: updates" \
              --notes "Where the installed app looks for updates. To install it, download it from the newest desktop-v release: Focus-Diff.dmg (Mac), Focus-Diff-Setup.exe (Windows), Focus-Diff.AppImage, .deb or .rpm (Linux)."
          fi
          gh release upload desktop-latest release/latest.json --clobber --repo "$GITHUB_REPOSITORY"
