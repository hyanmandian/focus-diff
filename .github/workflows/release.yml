name: Release

# Every merge to main updates a release pull request with the next version and its changelog, worked out from the
# conventional pull request titles. Merging that pull request tags the release, attaches the builds and publishes them.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run lint:firefox
      - run: npm run zip && npm run zip:firefox && npm run zip:safari

      # Fixed names, so the site can link to the latest release's files: one build for every Chromium browser
      # (Chrome, Edge, Brave, Arc, Opera), one for Firefox and the browsers built on it, one for Safari.
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          cp .output/*-chrome.zip release/focus-diff-chromium.zip
          cp .output/*-firefox.zip release/focus-diff-firefox.zip
          cp .output/*-safari.zip release/focus-diff-safari.zip
          cp .output/*-sources.zip release/focus-diff-sources.zip
          gh release upload "${{ needs.release-please.outputs.tag }}" release/*.zip --clobber

      - name: Publish to the stores
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: focus-diff@hyan.com.br
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          args=()
          if [ -n "$CHROME_EXTENSION_ID" ]; then args+=(--chrome-zip .output/*-chrome.zip); fi
          if [ -n "$FIREFOX_JWT_ISSUER" ]; then args+=(--firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip); fi
          if [ ${#args[@]} -eq 0 ]; then echo "No store secrets set, skipping."; exit 0; fi
          npx wxt submit "${args[@]}"
