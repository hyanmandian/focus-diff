name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PUBLISH_CHROME: ${{ secrets.CHROME_EXTENSION_ID != '' }}
      PUBLISH_FIREFOX: ${{ secrets.AMO_JWT_ISSUER != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the tag matches the manifest version
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi

      - run: npm run lint
      - run: npm test

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes

      - name: Publish to the Chrome Web Store
        if: env.PUBLISH_CHROME == 'true'
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: >
          npx --yes chrome-webstore-upload-cli@3 upload --auto-publish
          --source dist/focus-diff-*-chrome.zip
          --extension-id "$CHROME_EXTENSION_ID"
          --client-id "$CHROME_CLIENT_ID"
          --client-secret "$CHROME_CLIENT_SECRET"
          --refresh-token "$CHROME_REFRESH_TOKEN"

      - name: Publish to Firefox Add-ons
        if: env.PUBLISH_FIREFOX == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx web-ext sign --source-dir dist/firefox --channel listed
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
