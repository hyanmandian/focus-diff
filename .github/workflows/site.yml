name: Site

on:
  push:
    branches: [main]
    paths: ['packages/site/**', '.github/workflows/site.yml', 'package-lock.json']
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy focus-diff.com
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the site
        run: npm run build --workspace @focus-diff/site

      - name: Count the installs and stars
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packages/site/dist/badges
          node packages/site/installs.ts > packages/site/dist/badges/installs.json || rm -f packages/site/dist/badges/installs.json
          node packages/site/stars.ts > packages/site/dist/badges/stars.json || rm -f packages/site/dist/badges/stars.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/site/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
