[package]
name = "focus-diff"
version = "0.1.0"
description = "Your pull request reviews, from the menu bar."
authors = ["Hyan Mandian"]
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "focus_diff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
keyring = "4"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", default-features = false, features = ["time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri-plugin-notification = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSResponder", "NSWindow", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "NSFontDescriptor", "NSView", "NSControl", "NSButton", "NSToolbar", "NSPanel", "NSSound", "NSAnimation", "NSAnimationContext", "NSWorkspace", "NSAccessibility", "NSAttributedString", "NSBox", "NSColor", "NSFont", "NSParagraphStyle", "NSText", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CAMediaTimingFunction"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSBundle", "NSError", "NSString", "NSGeometry", "NSData", "NSDate", "NSTimeZone", "NSLocale", "NSArray", "NSAttributedString", "NSDictionary", "NSRange", "NSURL", "NSValue"] }

[features]
devctl = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
