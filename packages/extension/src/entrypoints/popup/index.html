<!doctype html>
<html lang="en" class="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__MSG_actionTitle__</title>
  </head>
  <body>
    <header class="head">
      <div class="head-row">
        <div class="brand">
          <img src="/logo-96.webp" width="22" height="22" alt="" />
          <h1 data-i18n="popupTitle"></h1>
        </div>
        <div class="head-actions">
          <button
            type="button"
            class="icon-button"
            id="review-now"
            aria-expanded="false"
            aria-controls="review-card"
          ></button>
          <button type="button" class="icon-button" id="settings" data-i18n-label="panelSettings"></button>
        </div>
      </div>

      <div class="tabs" role="tablist" data-i18n-label="popupLists">
        <button type="button" role="tab" class="tab" id="tab-reviews" aria-controls="panel-reviews">
          <span data-i18n="popupReviewQueue"></span>
          <span class="option-count" id="count-reviews"></span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-mine" aria-controls="panel-mine">
          <span data-i18n="popupMine"></span>
          <span class="option-count" id="count-mine"></span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-updates" aria-controls="panel-updates" hidden>
          <span data-i18n="popupUpdates"></span>
          <span class="option-count" id="count-updates"></span>
        </button>
        <button type="button" role="tab" class="tab" id="tab-merged" aria-controls="panel-merged" hidden>
          <span data-i18n="popupMerged"></span>
          <span class="option-count" id="count-merged"></span>
        </button>
      </div>
    </header>

    <section class="review-card" id="review-card" data-i18n-label="popupReviewTime" hidden></section>

    <main>
      <div class="notice" id="notice" hidden>
        <p id="notice-text" role="status"></p>
        <button type="button" class="text-button retry" data-i18n="popupRetry"></button>
      </div>
      <section class="list" role="tabpanel" id="panel-reviews" aria-labelledby="tab-reviews" tabindex="-1">
        <div class="filter-slot"></div>
        <div class="scroll">
          <div class="groups"></div>
          <div class="empty">
            <p data-i18n="popupReviewsEmpty"></p>
          </div>
          <a class="see-all" href="https://github.com/pulls/review-requested" target="_blank" rel="noopener">
            <span data-i18n="popupSeeAll"></span>
          </a>
        </div>
      </section>
      <section class="list" role="tabpanel" id="panel-mine" aria-labelledby="tab-mine" tabindex="-1" hidden>
        <div class="filter-slot"></div>
        <div class="scroll">
          <div class="groups"></div>
          <div class="empty">
            <p data-i18n="popupMineEmpty"></p>
          </div>
          <a class="see-all" href="https://github.com/pulls" target="_blank" rel="noopener">
            <span data-i18n="popupSeeAll"></span>
          </a>
        </div>
      </section>
      <section class="list" role="tabpanel" id="panel-updates" aria-labelledby="tab-updates" tabindex="-1" hidden>
        <div class="filter-slot"></div>
        <div class="scroll">
          <div class="groups"></div>
          <div class="empty">
            <p data-i18n="popupUpdatesEmpty"></p>
          </div>
          <a
            class="see-all"
            href="https://github.com/pulls?q=is%3Aopen+involves%3A%40me+-author%3A%40me"
            target="_blank"
            rel="noopener"
          >
            <span data-i18n="popupSeeAll"></span>
          </a>
        </div>
      </section>
      <section class="list" role="tabpanel" id="panel-merged" aria-labelledby="tab-merged" tabindex="-1" hidden>
        <div class="filter-slot"></div>
        <div class="scroll">
          <div class="groups"></div>
          <div class="empty">
            <p data-i18n="popupMergedEmpty"></p>
          </div>
          <a
            class="see-all"
            href="https://github.com/pulls?q=is%3Amerged+review-requested%3A%40me+-author%3A%40me"
            target="_blank"
            rel="noopener"
          >
            <span data-i18n="popupSeeAll"></span>
          </a>
        </div>
      </section>
      <div class="problem" id="problem" hidden>
        <p id="problem-text"></p>
        <a
          class="button"
          id="problem-link"
          href="https://github.com/login"
          target="_blank"
          rel="noopener"
          data-i18n="popupSignIn"
        ></a>
        <button type="button" class="button quiet retry" id="problem-retry" data-i18n="popupRetry"></button>
      </div>
    </main>

    <footer class="foot">
      <p id="updated" role="status"></p>
      <p id="flash" role="status"></p>
      <button type="button" class="text-button notify-state" id="notify-setup"></button>
      <div class="selection" id="selection" hidden>
        <p id="selection-text" role="status"></p>
        <button type="button" class="text-button quiet" id="selection-clear" data-i18n="popupClear"></button>
        <button type="button" class="button" id="mark-done" data-i18n="popupMarkDone"></button>
        <button type="button" class="button quiet" id="undo-done" data-i18n="popupUndo"></button>
      </div>
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
