<!doctype html>
<html lang="en" class="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="How Focus Diff filters pull request diffs, with examples to start from." />
    <title>Welcome to Focus Diff</title>
    <link rel="icon" href="/icon/32.png" />
  </head>
  <body class="welcome-page">
    <main class="welcome">
      <header class="hero">
        <img src="/icon/128.png" width="72" height="72" alt="" />
        <h1 data-i18n="welcomeTitle"></h1>
        <p class="lead" id="lead"></p>
      </header>

      <section class="how" aria-labelledby="how-h">
        <h2 id="how-h" data-i18n="howHeading"></h2>
        <ol class="steps">
          <li>
            <h3 data-i18n="howStep1Title"></h3>
            <p data-i18n="howStep1Body"></p>
          </li>
          <li>
            <h3 data-i18n="howStep2Title"></h3>
            <p data-i18n="howStep2Body"></p>
          </li>
          <li>
            <h3 data-i18n="howStep3Title"></h3>
            <p data-i18n="howStep3Body"></p>
          </li>
        </ol>
        <p class="hint demo-hint" data-i18n="demoHint"></p>
        <div id="demo"></div>
      </section>

      <section class="recipes-section" aria-labelledby="recipes-h">
        <h2 id="recipes-h" tabindex="-1" data-i18n="recipesHeading"></h2>
        <p class="hint" data-i18n="recipesHint"></p>
        <ul class="recipes" id="recipes"></ul>
      </section>

      <section class="next" aria-labelledby="next-h">
        <h2 id="next-h" data-i18n="welcomeNextHeading"></h2>
        <p id="shortcuts"></p>
        <a class="btn primary" href="/options.html" data-i18n="welcomeOpenSettings"></a>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <template id="recipe-template">
      <li class="recipe">
        <div class="recipe-text">
          <h3 class="recipe-title"></h3>
          <p class="recipe-description hint"></p>
          <div class="recipe-filters"></div>
        </div>
        <button type="button" class="btn recipe-toggle" aria-pressed="false"></button>
      </li>
    </template>

    <script type="module" src="./welcome.ts"></script>
  </body>
</html>
