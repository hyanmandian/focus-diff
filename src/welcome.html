<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to Focus Diff</title>
    <link rel="icon" href="icons/icon-32.png" />
    <link rel="stylesheet" href="options.css" />
    <link rel="stylesheet" href="welcome.css" />
  </head>
  <body class="welcome-page">
    <main class="welcome">
      <header class="hero">
        <img src="icons/icon-128.png" width="72" height="72" alt="" />
        <h1 data-i18n="welcomeTitle"></h1>
        <p class="lead" data-i18n="welcomeLead"></p>
      </header>

      <section class="how" aria-labelledby="how-h">
        <h2 id="how-h" data-i18n="howHeading"></h2>
        <div class="how-grid">
          <ol class="steps">
            <li><h3 data-i18n="howStep1Title"></h3><p data-i18n="howStep1Body"></p></li>
            <li><h3 data-i18n="howStep2Title"></h3><p data-i18n="howStep2Body"></p></li>
            <li><h3 data-i18n="howStep3Title"></h3><p data-i18n="howStep3Body"></p></li>
          </ol>
          <figure class="preview" role="img" data-i18n-label="previewLabel">
            <div class="preview-files" aria-hidden="true">
              <span class="file keep">web/src/book-card.tsx <b>+40</b></span>
              <span class="file">web/src/book-card.test.tsx</span>
              <span class="file">api/books/service.py</span>
              <span class="file keep">web/src/use-books.ts <b>+12</b></span>
              <span class="file">docs/books.md</span>
            </div>
            <div class="preview-bar" aria-hidden="true">
              <span class="chip" data-i18n="filterAll"></span>
              <span class="chip selected">Frontend</span>
              <span class="chip">Backend</span>
              <span class="preview-stats"><span class="mono">2/5</span> <span data-i18n="panelFilesLabel"></span> <span class="mono add">+52</span> <span class="mono del">−8</span></span>
            </div>
          </figure>
        </div>
      </section>

      <section class="recipes-section" aria-labelledby="recipes-h">
        <h2 id="recipes-h" tabindex="-1" data-i18n="recipesHeading"></h2>
        <p class="hint" data-i18n="recipesHint"></p>
        <ul class="recipes" id="recipes"></ul>
      </section>

      <section class="next" aria-labelledby="next-h">
        <h2 id="next-h" data-i18n="welcomeNextHeading"></h2>
        <p id="shortcuts"></p>
        <a class="btn primary" href="options.html" data-i18n="welcomeOpenSettings"></a>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <template id="recipe-template">
      <li class="recipe">
        <div class="recipe-text">
          <h3 class="recipe-title"></h3>
          <p class="recipe-description hint"></p>
          <div class="recipe-filters"></div>
        </div>
        <button type="button" class="btn recipe-toggle" aria-pressed="false"></button>
      </li>
    </template>

    <script src="shared.js"></script>
    <script src="page.js"></script>
    <script src="recipes.js"></script>
    <script src="welcome.js"></script>
  </body>
</html>
