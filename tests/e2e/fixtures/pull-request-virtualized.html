<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="user-login" content="reviewer" />
    <title>Add bookshelf · Pull Request #2</title>
    <style>
      body {
        font: 14px system-ui;
        margin: 0;
        padding: 16px;
      }
      .layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 16px;
      }
      .rows {
        position: relative;
      }
      .row {
        position: absolute;
        left: 0;
        right: 0;
      }
      [role='region'] {
        border: 1px solid #ccc;
        height: 560px;
        box-sizing: border-box;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <nav>
      <a role="tab" href="#">Conversation <span class="Counter">3</span></a>
      <a role="tab" href="#" aria-current="page">Files changed <span class="Counter">8</span></a>
    </nav>
    <div class="layout">
      <ul role="tree" aria-label="File tree" id="tree"></ul>
      <div data-testid="virtualized-diffs-list"><div class="rows" id="rows"></div></div>
    </div>
    <script>
      // GitHub's newer diff view, reduced: the embedded data lists every file, the list renders only files near the screen.
      // A thread with `comments` opens through its first comment's link, `#r<id>0`; one without only has its marker.
      const files = [
        ['web/src/book-card.tsx', 40, 10, { R12: [{ id: '101', resolved: false, comments: true }] }],
        ['web/src/book-card.test.tsx', 30, 5, {}],
        ['web/src/book-card.stories.tsx', 10, 0, {}],
        [
          'api/books/service.py',
          25,
          10,
          {
            R3: [{ id: '102', resolved: true, comments: true }],
            R40: [{ id: '103', resolved: false, comments: true, mine: true }],
          },
        ],
        ['api/tests/test_service.py', 10, 5, {}],
        ['docs/books.md', 5, 0, { R1: [{ id: '104', resolved: false }] }],
        ['api/books/__init__.py', 0, 0, {}],
        ['api/legacy/routes.py', 0, 0, {}],
      ];
      const digest = (index) => `d${index}`.padEnd(64, '0');
      const ROW = 600;
      const opened = new Set();
      const viewed = new Set(['docs/books.md']);
      const data = {
        payload: {
          pullRequestsChangesRoute: {
            diffSummaries: files.map(([path, added, removed, markers], index) => ({
              path,
              pathDigest: digest(index),
              linesAdded: added,
              linesDeleted: removed,
              changeType: 'MODIFIED',
              markedAsViewed: viewed.has(path),
              markersMap: Object.fromEntries(
                Object.entries(markers).map(([line, threads]) => [line, { threads: threads.map(({ id }) => ({ id })) }]),
              ),
            })),
            markers: {
              threads: Object.fromEntries(
                files
                  .flatMap(([, , , markers]) => Object.values(markers).flat())
                  .map(({ id, resolved, comments, mine }) => [
                    id,
                    {
                      id,
                      isResolved: resolved,
                      commentsData: {
                        comments: comments
                          ? [
                              { databaseId: Number(`${id}0`), viewerDidAuthor: false, reactionGroups: [] },
                              { databaseId: Number(`${id}1`), viewerDidAuthor: Boolean(mine), reactionGroups: [] },
                            ]
                          : [],
                      },
                    },
                  ]),
              ),
            },
          },
        },
      };
      const script = document.createElement('script');
      script.type = 'application/json';
      script.dataset.target = 'react-app.embeddedData';
      script.textContent = JSON.stringify(data);
      document.head.append(script);

      const tree = document.getElementById('tree');
      files.forEach(([path], index) => {
        const item = document.createElement('li');
        item.setAttribute('role', 'treeitem');
        item.innerHTML = `<div><a href="#diff-${digest(index)}">${path.split('/').pop()}</a></div>`;
        tree.append(item);
      });

      const rows = document.getElementById('rows');
      rows.style.height = `${files.length * ROW}px`;
      const render = (index) => {
        if (rows.querySelector(`[data-index="${index}"]`)) return;
        const [path, added, removed, markers] = files[index];
        const row = document.createElement('div');
        row.className = 'row';
        row.dataset.index = String(index);
        row.dataset.pathDigest = digest(index);
        row.style.top = `${index * ROW}px`;
        const indicators = Object.keys(markers)
          .map(
            (line) =>
              `<div class="CommentIndicator-module__commentIndicator_x1" data-line="${line}" style="margin-top: 120px">1 comment on ${line}</div>`,
          )
          .join('');
        row.innerHTML = `
          <div role="region" id="diff-${digest(index)}" aria-labelledby="heading-${index}">
            <div data-diff-header-wrapper>
              <h3 id="heading-${index}">‎${path}‎</h3>
              <button type="button" class="MarkAsViewedButton-module__iconOnly_x1" aria-label="${viewed.has(path) ? 'Viewed' : 'Not Viewed'}" aria-pressed="${viewed.has(path)}"></button>
              <span class="sr-only">Lines changed: ${added} additions &amp; ${removed} deletions</span>
            </div>
            ${indicators}
            ${Object.values(markers)
              .flat()
              .filter(({ id }) => opened.has(id))
              .map(({ id }) => `<div data-marker-id="${id}"><div id="r${id}0">Comment</div><div id="r${id}1">Reply</div></div>`)
              .join('')}
          </div>`;
        rows.append(row);
      };
      // Only the files near the screen are in the page, like GitHub's virtual list.
      const sync = () => {
        const first = Math.max(0, Math.floor((scrollY - 400) / ROW));
        const last = Math.min(files.length - 1, Math.floor((scrollY + innerHeight) / ROW));
        for (const row of [...rows.children]) {
          const index = Number(row.dataset.index);
          if (index < first || index > last) row.remove();
        }
        for (let index = first; index <= last; index++) render(index);
      };
      addEventListener('scroll', sync);
      // Like GitHub, a comment link scrolls to the thread's file and opens the thread, a moment later.
      addEventListener('hashchange', () => {
        const id = /^#r(\d+)0$/.exec(location.hash)?.[1];
        const index = files.findIndex(([, , , markers]) =>
          Object.values(markers)
            .flat()
            .some((thread) => thread.id === id),
        );
        if (index === -1) return;
        opened.add(id);
        rows.querySelector(`[data-index="${index}"]`)?.remove();
        scrollTo({ top: rows.getBoundingClientRect().top + scrollY + index * ROW - 70 });
        setTimeout(sync, 100);
      });
      sync();
      document.addEventListener('click', (event) => {
        const link = event.target.closest('[role="treeitem"] a');
        if (link) {
          event.preventDefault();
          const index = files.findIndex((_, i) => link.getAttribute('href') === `#diff-${digest(i)}`);
          scrollTo({ top: rows.getBoundingClientRect().top + scrollY + index * ROW - 70 });
          sync();
        }
        const toggle = event.target.closest('button[class*="MarkAsViewedButton"]');
        if (toggle) {
          const on = toggle.getAttribute('aria-pressed') !== 'true';
          toggle.setAttribute('aria-pressed', String(on));
          toggle.setAttribute('aria-label', on ? 'Viewed' : 'Not Viewed');
        }
      });
    </script>
  </body>
</html>
